title: Outbound Connections to Remote IP
category: network
platforms: xql,kql,spl
verified: xql
tactic: TA0011
tacticName: Command and Control
technique: T1071
techniqueName: Application Layer Protocol
tags: network,pivot,c2,exfil,ioc
date_added: 2026-05-21
description: All network events to a specific remote IP — use for C2, exfil, or lateral movement investigation
queries:
  xql: |
    config case_sensitive = true
    | preset = network_story
    | filter action_remote_ip contains "<remote_ip>"
  kql: |
    DeviceNetworkEvents
    | where RemoteIP == "<remote_ip>"
    | project TimeGenerated, DeviceName, LocalIP, RemoteIP, RemotePort, Protocol, InitiatingProcessFileName, InitiatingProcessCommandLine
    | order by TimeGenerated desc
  spl: |
    index=* sourcetype="sysmon" EventCode=3
        DestinationIp="<remote_ip>"
    | table _time, ComputerName, SourceIp, DestinationIp, DestinationPort, Image, CommandLine
    | sort - _time

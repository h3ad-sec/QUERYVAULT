title: User Auth History by Source IP
category: auth
platforms: xql,kql,spl
verified: xql
tactic: TA0006
tacticName: Credential Access
technique: T1078
techniqueName: Valid Accounts
tags: auth,sign-in,pivot,ioc,entra-id
date_added: 2026-05-21
description: Full auth history for a user and source IP — confirms presence, pivots on outcome
queries:
  xql: |
    config case_sensitive = true
    | preset = authentication_story
    | filter auth_identity contains "<username>"
    | filter action_local_ip contains "<source_ip>"
  kql: |
    SigninLogs
    | where UserPrincipalName contains "<username>"
    | where IPAddress == "<source_ip>"
    | project TimeGenerated, UserPrincipalName, IPAddress, ResultType, ResultDescription, AppDisplayName, Location
    | order by TimeGenerated desc
  spl: |
    index=* sourcetype="azure:aad:signin"
        userPrincipalName="*<username>*"
        ipAddress="<source_ip>"
    | table _time, userPrincipalName, ipAddress, resultType, resultDescription, appDisplayName
    | sort - _time

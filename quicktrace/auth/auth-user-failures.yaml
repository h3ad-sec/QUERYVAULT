title: Failed Auth Attempts by User
category: auth
platforms: xql,kql,spl
verified: xql
tactic: TA0006
tacticName: Credential Access
technique: T1110
techniqueName: Brute Force
tags: auth,brute-force,credential-stuffing,entra-id
date_added: 2026-05-21
description: Failed auth attempts for a specific user — use for brute force or credential stuffing investigation
queries:
  xql: |
    config case_sensitive = true
    | preset = authentication_story
    | filter auth_identity contains "<username>"
    | filter auth_outcome contains "FAILED"
  kql: |
    SigninLogs
    | where UserPrincipalName contains "<username>"
    | where ResultType != "0"
    | project TimeGenerated, UserPrincipalName, IPAddress, ResultType, ResultDescription, AppDisplayName
    | order by TimeGenerated desc
  spl: |
    index=* sourcetype="azure:aad:signin"
        userPrincipalName="*<username>*"
        resultType!="0"
    | table _time, userPrincipalName, ipAddress, resultType, resultDescription
    | sort - _time

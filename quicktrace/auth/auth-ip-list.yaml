title: Auth Events Across Suspicious IP List
category: auth
platforms: xql,kql,spl
verified: xql
tactic: TA0006
tacticName: Credential Access
technique: T1078
techniqueName: Valid Accounts
tags: auth,ioc-sweep,bulk-pivot,entra-id
date_added: 2026-05-21
description: All auth events from a list of suspicious IPs — use for IOC-based user pivoting
queries:
  xql: |
    config case_sensitive = true
    | preset = authentication_story
    | filter action_local_ip in (
        "<ip_1>",
        "<ip_2>"
    )
  kql: |
    SigninLogs
    | where IPAddress in ("<ip_1>", "<ip_2>")
    | project TimeGenerated, UserPrincipalName, IPAddress, ResultType, ResultDescription, AppDisplayName
    | order by TimeGenerated desc
  spl: |
    index=* sourcetype="azure:aad:signin"
        (ipAddress="<ip_1>" OR ipAddress="<ip_2>")
    | table _time, userPrincipalName, ipAddress, resultType, appDisplayName
    | sort - _time

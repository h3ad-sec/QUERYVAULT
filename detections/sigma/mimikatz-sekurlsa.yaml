title: Mimikatz Credential Harvesting
tactic: TA0006
tacticName: Credential Access
technique: T1003.001
techniqueName: LSASS Memory
description: Detects Mimikatz sekurlsa module usage by matching known command-line patterns in process creation events
query: |
  title: Mimikatz Credential Harvesting via sekurlsa
  id: 3d4a9f42-c9b7-4e1a-9f6c-2d8a7f1e3b90
  status: stable
  author: H3AD-SEC Detection Engineering
  date: 2026/05/13
  logsource:
    category: process_creation
    product: windows
  detection:
    selection_image:
      Image|endswith: '\mimikatz.exe'
    selection_cmdline:
      CommandLine|contains:
        - 'sekurlsa::'
        - 'lsadump::'
        - 'kerberos::'
        - 'privilege::debug'
        - 'crypto::'
        - 'ts::'
        - 'vault::'
    selection_original:
      OriginalFileName: 'mimikatz.exe'
    condition: 1 of selection_*
  falsepositives:
    - Authorized red team or penetration testing activity
    - Security research in isolated lab environments
  level: critical
  tags:
    - attack.credential_access
    - attack.t1003.001

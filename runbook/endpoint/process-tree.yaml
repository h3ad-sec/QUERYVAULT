title: Process Tree Review
category: endpoint
platform: kql
description: Build process ancestry chain for a suspicious process on a specific device
query: |
  DeviceProcessEvents
  | where TimeGenerated > ago(1h)
  | where DeviceName == "<device_name>"
  | project TimeGenerated, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, AccountName
  | order by TimeGenerated asc
